[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "roundready"
version = "0.1.0"
description = "Resume-aware mock interviews with evidence-based rubric feedback"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
roundready = "roundready.cli:main"
[tool.setuptools.packages.find]
include = ["roundready*"]
[tool.setuptools.package-data]
roundready = ["*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
